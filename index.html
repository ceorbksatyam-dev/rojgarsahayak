<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYO - Room On Your Own</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<div id="app" class="max-w-md mx-auto bg-white min-h-screen">
  <!-- Login Screen -->
  <div id="login" class="p-6">
    <h1 class="text-3xl font-bold">ROYO</h1>
    <p class="text-gray-500 mb-8">Room On Your Own</p>
    <input id="phone" placeholder="Mobile Number" class="w-full border p-3 rounded-xl mb-3">
    <button onclick="showHome()" class="w-full bg-black text-white p-3 rounded-xl">Continue</button>
  </div>
  <!-- Home Screen -->
  <div id="home" class="hidden">
    <div class="p-4 flex justify-between items-center">
      <h2 class="font-bold text-xl">Kanpur Rooms</h2>
      <button onclick="showOwner()" class="bg-black text-white px-3 py-1 rounded-full text-sm">+ List Room</button>
    </div>
    <div class="p-4 space-y-4">
      <div onclick="showDetail()" class="border rounded-2xl overflow-hidden">
        <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267" class="h-48 w-full object-cover">
        <div class="p-3">
          <h3 class="font-bold">1BHK in Kakadeo - For Student</h3>
          <p class="text-sm text-gray-500"><i class="fa fa-location-dot"></i> Near CSJM, Kanpur</p>
          <p class="font-bold mt-1">₹4,500 / month</p>
        </div>
      </div>
      <div onclick="showDetail()" class="border rounded-2xl overflow-hidden">
        <img src="https://images.unsplash.com/photo-1502672023488-70e25813eb80" class="h-48 w-full object-cover">
        <div class="p-3">
          <h3 class="font-bold">Single Room with Kitchen</h3>
          <p class="text-sm text-gray-500">Kidwai Nagar</p>
          <p class="font-bold mt-1">₹3,500 / month</p>
        </div>
      </div>
    </div>
  </div>
  <!-- Detail -->
  <div id="detail" class="hidden">
    <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267" class="h-64 w-full object-cover">
    <div class="p-4">
      <button onclick="showHome()" class="mb-3"><i class="fa fa-arrow-left"></i> Back</button>
      <h2 class="text-2xl font-bold">1BHK in Kakadeo</h2>
      <p class="text-gray-600 mt-2">Owner se direct baat karo, no brokerage.</p>
      <a href="tel:9000000000" class="block mt-6 bg-green-600 text-white text-center p-3 rounded-xl">Call Owner</a>
    </div>
  </div>
  <!-- Owner Upload with Dual Photo -->
  <div id="owner" class="hidden p-4">
    <button onclick="showHome()" class="mb-3"><i class="fa fa-arrow-left"></i> Back</button>
    <h2 class="text-xl font-bold mb-4">List Your Room</h2>
    <input placeholder="Room Title" class="w-full border p-3 rounded-xl mb-3">
    <input placeholder="Rent per month" type="number" class="w-full border p-3 rounded-xl mb-3">
    <p class="font-bold mt-2">Room Photos (2 photo - andar + bahar)</p>
    <div class="grid grid-cols-2 gap-3 mt-2">
      <label class="border-2 border-dashed p-6 rounded-xl text-center">
        <i class="fa fa-camera text-2xl"></i><p class="text-sm mt-1">Photo 1 - Inside</p>
        <input type="file" accept="image/*" class="hidden" onchange="preview(event, 'p1')">
        <img id="p1" class="mt-2 hidden rounded-lg">
      </label>
      <label class="border-2 border-dashed p-6 rounded-xl text-center">
        <i class="fa fa-camera text-2xl"></i><p class="text-sm mt-1">Photo 2 - Outside / Building</p>
        <input type="file" accept="image/*" class="hidden" onchange="preview(event, 'p2')">
        <img id="p2" class="mt-2 hidden rounded-lg">
      </label>
    </div>
    <button onclick="alert('Room Listed! (Demo)'); showHome()" class="w-full bg-black text-white p-3 rounded-xl mt-6">Submit Room</button>
  </div>
</div>
<script>
function showHome(){ hideAll(); document.getElementById('home').classList.remove('hidden'); }
function showDetail(){ hideAll(); document.getElementById('detail').classList.remove('hidden'); }
function showOwner(){ hideAll(); document.getElementById('owner').classList.remove('hidden'); }
function hideAll(){ document.getElementById('login').classList.add('hidden'); document.getElementById('home').classList.add('hidden'); document.getElementById('detail').classList.add('hidden'); document.getElementById('owner').classList.add('hidden'); }
function preview(e, id){ const img=document.getElementById(id); img.src=URL.createObjectURL(e.target.files[0]); img.classList.remove('hidden'); }
</script>
</body>
</html>
