<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROYO CLOUD</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f5f5f5}
.header{background:#fff;padding:12px 15px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:99;box-shadow:0 2px 5px #0001}
.logo{font-size:28px;font-weight:900;color:#e11d48}.logo span{color:#000}
.banner{background:#e11d48;color:#fff;padding:25px 15px;text-align:center}
.searchBox{background:#fff;border-radius:15px;padding:15px;margin-top:15px}
.searchBox input{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:10px}
.btn{padding:12px 20px;border:none;border-radius:25px;font-weight:700;cursor:pointer}
.btn-red{background:#e11d48;color:#fff}.btn-green{background:#00b050;color:#fff;width:100%;margin-top:10px}
.roomCard{background:#fff;margin:10px;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px #0001}
.roomImg{width:100%;height:210px;object-fit:cover}
.roomBody{padding:12px}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:999;padding:20px;overflow-y:auto}
.modalBox{background:#fff;border-radius:15px;padding:20px;max-width:420px;margin:20px auto}
.preview{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.preview img{width:70px;height:70px;border-radius:8px;object-fit:cover}
</style></head><body>
<div class="header"><div class="logo">ROY<span>O</span></div><div onclick="openOwner()" style="font-weight:700">Become Owner</div></div>
<div class="banner"><h2>India ka Sabse Sasta Room Booking ☁️</h2><p>Ab Photo Cloud pe - OYO jaisa</p>
<div class="searchBox"><input id="city" placeholder="City - Ballia, Varanasi"><button class="btn btn-green" onclick="searchRooms()">Search</button></div></div>
<div style="display:flex;gap:8px;padding:12px"><button class="btn btn-red" onclick="showRooms(rooms)">🔍 ROOM LO</button>
<button class="btn" style="border:2px solid #e11d48;color:#e11d48;background:#fff" onclick="openOwner()">🏃 ROOM DO</button></div>
<div id="roomList"></div>
<div id="ownerModal" class="modal"><div class="modalBox">
<h3 style="color:#e11d48">🏠 ROOM DO - Cloud Upload</h3>
<input id="oTitle" placeholder="Room Title - Ballia me 1BHK" style="width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:10px">
<input id="oCity" placeholder="City - Ballia" style="width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:10px">
<input id="oArea" placeholder="Area - Kurem Rasra" style="width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:10px">
<div style="display:flex;gap:5px"><input id="oRent" type="number" placeholder="Rent 3500" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:10px">
<select id="oCat" style="padding:12px;border:1px solid #ddd;border-radius:10px"><option>Boys</option><option>Girls</option><option>Family</option><option>Student</option></select></div>
<input id="oPhone" placeholder="Owner WhatsApp No" style="width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:10px">
<label style="font-weight:700;margin-top:10px;display:block">📸 5 Photo (OYO jaisa Cloud)</label>
<input type="file" id="oPhotos" accept="image/*" multiple onchange="handleUpload(this)">
<div id="photoPreview" class="preview"></div><div id="status" style="font-size:13px;color:green;font-weight:700;margin-top:8px"></div>
<button id="postBtn" class="btn btn-green" onclick="postRoom()">✅ POST KARO</button>
<button class="btn" style="width:100%;margin-top:8px;background:#eee" onclick="closeOwner()">Cancel</button>
</div></div>
<script>
let rooms=JSON.parse(localStorage.getItem('royoCloud')||'[]'); let cloudImages=[]; let uploading=false;
if(rooms.length==0){rooms=[{title:"Student PG Varanasi",city:"Varanasi",area:"BHU",rent:3500,cat:"Student",phone:"9999999999",imgs:["https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=500"]}];}
function openOwner(){document.getElementById('ownerModal').style.display='block'}
function closeOwner(){document.getElementById('ownerModal').style.display='none'}
async function handleUpload(input){
cloudImages=[]; uploading=true; document.getElementById('status').innerText='☁️ Cloud pe bhej raha hu...';
document.getElementById('postBtn').innerText='Ruko... Upload ho raha hai'; document.getElementById('postBtn').disabled=true;
for(let file of input.files){
let reader=new FileReader(); reader.readAsDataURL(file);
await new Promise(res=>{
reader.onload=e=>{
let img=new Image(); img.onload=()=>{
let c=document.createElement('canvas'); c.width=800; c.height=800*img.height/img.width;
c.getContext('2d').drawImage(img,0,0,c.width,c.height);
cloudImages.push(c.toDataURL('image/jpeg',0.6)); res();
}; img.src=e.target.result;
}});
}
document.getElementById('photoPreview').innerHTML=cloudImages.map(u=>`<img src="${u}">`).join('');
document.getElementById('status').innerText='✅ '+cloudImages.length+' Photo Ready! Ab POST dabao';
document.getElementById('postBtn').innerText='✅ POST KARO'; document.getElementById('postBtn').disabled=false; uploading=false;
}
function postRoom(){
if(uploading){alert('2 sec ruko photo ready ho raha hai');return}
let t=document.getElementById('oTitle').value, c=document.getElementById('oCity').value, a=document.getElementById('oArea').value;
let r=document.getElementById('oRent').value, cat=document.getElementById('oCat').value, p=document.getElementById('oPhone').value;
if(!t||!c||!r||!p){alert('Sab bharo');return} if(cloudImages.length==0){alert('1 Photo dalo');return}
rooms.unshift({title:t,city:c,area:a,rent:r,cat:cat,phone:p,imgs:cloudImages});
localStorage.setItem('royoCloud',JSON.stringify(rooms)); alert('✅ LIVE ho gaya OYO jaisa!'); closeOwner(); showRooms(rooms);
}
function showRooms(list){
let h=''; list.forEach((x,i)=>{
h+=`<div class="roomCard"><img class="roomImg" src="${x.imgs[0]}"><div class="roomBody"><b>₹${x.rent}/m - ${x.cat}</b><h4>${x.title}</h4><p style="color:gray;font-size:13px">${x.city}-${x.area}</p><button class="btn btn-green" onclick="book(${i})">📲 Book on WhatsApp</button></div></div>`;
}); document.getElementById('roomList').innerHTML=h;
}
function book(i){let r=rooms[i]; window.open('https://wa.me/91'+r.phone+'?text=Hi ROYO pe room chahiye '+r.title,'_blank');}
function searchRooms(){let c=document.getElementById('city').value.toLowerCase(); showRooms(rooms.filter(x=>!c||x.city.toLowerCase().includes(c)));}
showRooms(rooms);
</script></body></html>
