<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROYO</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
body{font-family:sans-serif;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#1e293b;padding:25px;border-radius:15px;width:340px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;outline:none;font-size:16px}
button{width:100%;padding:12px;background:#38bdf8;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px;color:#000}
.link{font-size:13px;text-align:center;margin-top:12px;color:#94a3b8} .link span{color:#38bdf8;font-weight:600;cursor:pointer}
#recaptcha-container{opacity:0;position:absolute}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h2>ROYO 🏨</h2>

<div id="signupDiv">
<p>Create Account</p>
<input id="s_name" placeholder="Full Name">
<input id="s_phone" placeholder="+91 9876543210" value="+91">
<button onclick="sendOTP('signup')">Sign Up - Get OTP</button>
<div class="link">Already account? <span onclick="showLogin()">Login</span></div>
</div>

<div id="loginDiv" class="hidden">
<p>Welcome Back</p>
<input id="l_phone" placeholder="+91 9876543210" value="+91">
<button onclick="sendOTP('login')">Login - Get OTP</button>
<div class="link">New user? <span onclick="showSignup()">Sign Up</span></div>
</div>

<div id="otpDiv" class="hidden">
<p>OTP sent to <b id="showNum"></b></p>
<input id="otp" placeholder="6 Digit OTP">
<button onclick="verifyOTP()">Verify OTP</button>
</div>

<p id="message" style="font-size:13px;margin-top:10px;color:#fbbf24"></p>
</div>

<div id="recaptcha-container"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAzOLv_Y_rbeLn7S94IviUavKgZxQbqMAg",
  authDomain: "royo-59dac.firebaseapp.com",
  projectId: "royo-59dac",
  storageBucket: "royo-59dac.firebasestorage.app",
  messagingSenderId: "139395940658",
  appId: "1:139395940658:web:e71b0e803272f4ed10d72b",
  measurementId: "G-BRNCMNQ4FW"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'invisible'});
recaptchaVerifier.render();

let confirmationResult;
let currentMode='signup';
let tempName='';

function showLogin(){signupDiv.classList.add('hidden');otpDiv.classList.add('hidden');loginDiv.classList.remove('hidden')}
function showSignup(){loginDiv.classList.add('hidden');otpDiv.classList.add('hidden');signupDiv.classList.remove('hidden')}

function sendOTP(mode){
  currentMode=mode;
  let phone = mode=='signup' ? document.getElementById('s_phone').value : document.getElementById('l_phone').value;
  if(mode=='signup'){tempName=document.getElementById('s_name').value; if(!tempName){alert('Name likho');return}}
  if(!phone || phone.length<13){alert('Sahi number likho +91 ke saath');return}
  document.getElementById('showNum').innerText=phone;
  document.getElementById('message').innerText='OTP bhej rahe hai...';
  auth.signInWithPhoneNumber(phone, window.recaptchaVerifier).then(r=>{
    confirmationResult=r;
    signupDiv.classList.add('hidden');loginDiv.classList.add('hidden');otpDiv.classList.remove('hidden');
    document.getElementById('message').innerText='OTP bhej diya!';
  }).catch(e=>{document.getElementById('message').innerText=e.message})
}

function verifyOTP(){
  let code=document.getElementById('otp').value;
  confirmationResult.confirm(code).then(res=>{
    if(currentMode=='signup'){
      db.collection('users').doc(res.user.uid).set({name:tempName, phone:res.user.phoneNumber, created:new Date()})
    }
    alert('ROYO me Swagat hai! Login ho gaya!');
    // window.location.href='home.html';
  }).catch(()=>{document.getElementById('message').innerText='Galat OTP'})
}
</script>
</body>
</html>
